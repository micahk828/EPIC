<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Web3Forms Full Replica Test</title></head>
<body>
  <h1>Full Replica Test</h1>
  <form id="test-form">
    <input type="hidden" name="access_key" value="804d7fba-608c-4388-a1b3-c5ed130c6c9d">
    <input type="hidden" name="subject" value="New RSVP: Homecoming Youth Weekend 2026">
    <input type="hidden" name="from_name" value="E.P.i.C. Youth Ministry RSVP">

    <input type="text" name="name" required value="Test User"><br><br>
    <input type="email" name="email" required value="testuser@gmail.com"><br><br>
    <input type="text" name="phone" value="5551234567"><br><br>
    <input type="text" name="church" value="Test Church"><br><br>

    <select name="attendance_days">
      <option value="Friday & Saturday (Sept 25-26)" selected>Friday & Saturday (Sept 25-26)</option>
    </select><br><br>

    <input type="number" name="adult_count" value="2"><br><br>
    <input type="text" name="adult_names" value="Jane Doe,John Doe"><br><br>
    <input type="number" name="child_count" value="1"><br><br>
    <input type="text" name="child_names" value="Timmy Doe"><br><br>

    <select name="attending_social">
      <option value="Yes" selected>Yes</option>
    </select><br><br>

    <input type="number" name="social_participant_tickets" value="2"><br><br>
    <input type="number" name="social_chaperone_passes" value="1"><br><br>

    <input type="checkbox" name="botcheck" style="display:none;">
    <button type="submit" id="btn">Submit</button>
  </form>
  <pre id="result"></pre>

  <script>
    document.getElementById('test-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const resultEl = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        resultEl.textContent = JSON.stringify(result, null, 2);
        console.log('Result:', result);
      } catch (err) {
        resultEl.textContent = 'Network error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
