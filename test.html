<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Web3Forms Fetch Test</title></head>
<body>
  <h1>Fetch Test</h1>
  <form id="test-form">
    <input type="hidden" name="access_key" value="804d7fba-608c-4388-a1b3-c5ed130c6c9d">
    <input type="text" name="name" required placeholder="Name" value="Test User"><br><br>
    <input type="email" name="email" required placeholder="Email" value="testuser@gmail.com"><br><br>
    <textarea name="message" required placeholder="Message">This is a test message.</textarea><br><br>
    <input type="checkbox" name="botcheck" style="display:none;">
    <button type="submit" id="btn">Submit</button>
  </form>
  <pre id="result"></pre>

  <script>
    document.getElementById('test-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const resultEl = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData(e.target);

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        resultEl.textContent = JSON.stringify(result, null, 2);
        console.log('Result:', result);
      } catch (err) {
        resultEl.textContent = 'Network error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
